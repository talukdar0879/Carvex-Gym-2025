<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CARVEX Admin Panel</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0d0d0d;
color:white;
padding:40px;
}

.container{
max-width:1200px;
margin:auto;
}

h1{
text-align:center;
font-size:48px;
margin-bottom:10px;
}

h1 span{
color:#ff3b3b;
}

.subtitle{
text-align:center;
color:#aaa;
margin-bottom:40px;
}

.dashboard{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
margin-bottom:40px;
}

.card{
background:#181818;
border:2px solid #ff3b3b;
border-radius:15px;
padding:25px;
cursor:pointer;
transition:.3s;
box-shadow:0 0 15px rgba(255,0,0,.2);
}

.card:hover{
transform:translateY(-5px);
box-shadow:0 0 25px rgba(255,0,0,.5);
}

.card h2{
margin-bottom:10px;
color:#ff3b3b;
}

.card p{
color:#bbb;
}

#content{
background:#181818;
border:2px solid #333;
padding:30px;
border-radius:15px;
min-height:250px;
}

button{
background:#ff3b3b;
color:white;
border:none;
padding:12px 25px;
border-radius:8px;
cursor:pointer;
margin:10px;
font-size:16px;
font-weight:bold;
}

button:hover{
background:#ff5555;
}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}

table td,table th{
padding:12px;
border-bottom:1px solid #333;
text-align:left;
}

table th{
color:#ff3b3b;
}

</style>

</head>

<body>

<div class="container">

<h1>CARVEX <span>ADMIN</span></h1>

<p class="subtitle">Gym Management Dashboard</p>

<div class="dashboard">

<div class="card" onclick="showSection('members')">
<h2>👥 Members</h2>
<p>Manage gym members</p>
</div>

<div class="card" onclick="showSection('leaderboard')">
<h2>🏆 Leaderboard</h2>
<p>Approve member records</p>
</div>

<div class="card" onclick="showSection('membership')">
<h2>💰 Membership</h2>
<p>Renew memberships</p>
</div>

<div class="card" onclick="showSection('email')">
<h2>📧 Email</h2>
<p>Send reminders</p>
</div>

</div>

<div id="content">

<h2 style="color:#ff3b3b;">Welcome Admin</h2>

<br>

<p>Select a card above to begin managing your gym.</p>

</div>

</div>

<script>

function showSection(section){

let box=document.getElementById("content");

if(section=="members"){

box.innerHTML=`

<h2 style="color:#ff3b3b;">👥 Members</h2>

<br>

<table>

<tr>

<th>Name</th>

<th>Status</th>

</tr>

<tr>

<td>Rahul</td>

<td>Active</td>

</tr>

<tr>

<td>Aman</td>

<td>Expired</td>
.stats{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(220px,1fr));

gap:20px;

margin-bottom:40px;

}

.stat{

background:#181818;

border:2px solid #ff2b2b;

border-radius:15px;

padding:25px;

text-align:center;

box-shadow:0 0 15px rgba(255,0,0,.2);

transition:.3s;

}

.stat:hover{

transform:translateY(-6px);

box-shadow:0 0 25px rgba(255,0,0,.45);

}

.stat h2{

font-size:38px;

color:#ff2b2b;

margin-bottom:10px;

}

.stat p{

color:#bbb;

font-size:15px;

}
</tr>

</table>

<br>

<button>Add Member</button>

<button>View All</button>

`;

}

else if(section=="leaderboard"){

box.innerHTML=`

<h2 style="color:#ff3b3b;">🏆 Leaderboard</h2>

<br>

<table>

<tr>

<th>Name</th>

<th>Exercise</th>

<th>Weight</th>

</tr>

<tr>

<td>Rahul</td>

<td>Bench Press</td>

<td>80 kg</td>

</tr>

</table>

<br>

<button>Approve</button>

<button>Reject</button>

`;

}

else if(section=="membership"){

box.innerHTML=`

<h2 style="color:#ff3b3b;">💰 Membership</h2>

<br>

<table>

<tr>

<th>Name</th>

<th>Expires</th>

</tr>

<tr>

<td>Aman</td>

<td>5 Aug 2026</td>

</tr>

</table>

<br>

<button>Renew Membership</button>

`;

}

else if(section=="email"){

box.innerHTML=`

<h2 style="color:#ff3b3b;">📧 Email Reminders</h2>

<br>

<p>Automatic reminders will be connected next.</p>

<br>

<button>Send Reminder</button>

`;

}

}
<p class="subtitle">Gym Management Dashboard</p>

  <div class="stats">

<div class="stat">
<h2 id="membersCount">38</h2>
<p>Total Members</p>
</div>

<div class="stat">
<h2 id="incomeCount">₹18,600</h2>
<p>This Month Income</p>
</div>

<div class="stat">
<h2 id="feesCount">6</h2>
<p>Fees Due</p>
</div>

<div class="stat">
<h2 id="recordsCount">3</h2>
<p>Pending Records</p>


</div>

  <script>

let members=38;

let income=18600;

let due=6;

let records=3;

document.getElementById("membersCount").innerHTML=members;

document.getElementById("incomeCount").innerHTML="₹"+income;

document.getElementById("feesCount").innerHTML=due;

document.getElementById("recordsCount").innerHTML=records;

</script>

</body>

</html>
