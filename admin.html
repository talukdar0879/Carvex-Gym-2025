<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CARVEX Admin</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0d0d0d;
color:#fff;
display:flex;
min-height:100vh;
}

.sidebar{
width:280px;
background:#111;
border-right:2px solid #ff2b2b;
padding:25px;
}

.logo{
font-size:30px;
font-weight:bold;
text-align:center;
margin-bottom:40px;
}

.logo span{
color:#ff2b2b;
}

.menu button{

width:100%;
background:#181818;
border:2px solid #333;
color:#fff;
padding:15px;
margin-bottom:15px;
border-radius:10px;
cursor:pointer;
font-size:16px;
transition:.3s;

}

.menu button:hover{

background:#ff2b2b;

}

.main{

flex:1;
padding:30px;

}

.top{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(220px,1fr));

gap:20px;

margin-bottom:30px;

}

.stat{

background:#181818;

border:2px solid #ff2b2b;

padding:25px;

border-radius:15px;

text-align:center;

}

.stat h2{

font-size:38px;

color:#ff2b2b;

margin-bottom:10px;

}

.stat p{

color:#aaa;

}

#content{

background:#181818;

border-radius:15px;

padding:30px;

min-height:500px;

border:2px solid #333;

}

table{

width:100%;

border-collapse:collapse;

margin-top:20px;

}

table th{

background:#ff2b2b;

padding:12px;

}

table td{

padding:12px;

border-bottom:1px solid #333;

}

input{

width:100%;

padding:12px;

margin:10px 0;

background:#111;

border:1px solid #444;

color:white;

border-radius:8px;

}

button.red{

background:#ff2b2b;

border:none;

padding:12px 20px;

color:white;

border-radius:8px;

cursor:pointer;

margin-top:10px;

}

button.red:hover{

background:#ff5555;

}

@media(max-width:900px){

body{

flex-direction:column;

}

.sidebar{

width:100%;

}

}

</style>

</head>

<body>

<div class="sidebar">

<div class="logo">

CARVEX

<span>ADMIN</span>

</div>

<div class="menu">

<button onclick="dashboard()">🏠 Dashboard</button>

<button onclick="members()">👥 Members</button>

<button onclick="leaderboard()">🏆 Leaderboard</button>

<button onclick="membership()">💰 Membership</button>

<button onclick="email()">📧 Email</button>

<button onclick="settings()">⚙ Settings</button>

</div>

</div>

<div class="main">

<div class="top">

<div class="stat">

<h2 id="members">38</h2>

<p>Total Members</p>

</div>

<div class="stat">

<h2 id="income">₹18600</h2>

<p>Monthly Income</p>

</div>

<div class="stat">

<h2 id="due">6</h2>

<p>Fees Due</p>

</div>

<div class="stat">

<h2 id="records">3</h2>

<p>Pending Records</p>

</div>

</div>

<div id="content">

<h1 style="color:#ff2b2b;">Welcome Admin</h1>

<br>

<p>Select a menu from the left.</p>

</div>

</div>

<script>

function dashboard(){

document.getElementById("content").innerHTML=`

<h1 style="color:#ff2b2b;">Dashboard</h1>

<br>

<p>Welcome back, Admin.</p>

<table>

<tr>
<th>Today's Summary</th>
<th>Value</th>
</tr>

<tr>
<td>Total Members</td>
<td>38</td>
</tr>

<tr>
<td>Income</td>
<td>₹18,600</td>
</tr>

<tr>
<td>Pending Records</td>
<td>3</td>
</tr>

<tr>
<td>Fees Due</td>
<td>6</td>
</tr>

</table>

`;

}

function showDashboard(){

document.getElementById("pageTitle").innerHTML="Dashboard";

document.getElementById("content").innerHTML=`

<div class="cards">

<div class="card">
<h2 id="totalMembers">38</h2>
<p>Total Members</p>
</div>

<div class="card">
<h2 id="activeMembers">32</h2>
<p>Active Members</p>
</div>

<div class="card">
<h2 id="feesDue">6</h2>
<p>Fees Due</p>
</div>

<div class="card">
<h2 id="monthlyIncome">₹18,600</h2>
<p>Monthly Income</p>
</div>

<div class="card">
<h2 id="pendingRecords">3</h2>
<p>Pending Records</p>
</div>

<div class="card">
<h2 id="newMembers">4</h2>
<p>New Members</p>
</div>

</div>

<div class="quick">

<h2>Quick Actions</h2>

<button onclick="showMembers()">➕ Add Member</button>

<button onclick="showPayments()">💰 Record Payment</button>

<button onclick="showLeaderboard()">🏆 Add Record</button>

<button onclick="showEmail()">📧 Send Reminder</button>

</div>

<div class="activity">

<h2>Recent Activity</h2>

<ul>

<li>✅ Rahul joined today</li>

<li>💰 Aman renewed membership</li>

<li>🏆 Bench record approved</li>

<li>👤 Riya paid ₹500</li>

</ul>

</div>

`;

}

function leaderboard(){

document.getElementById("content").innerHTML=`

<h1 style="color:#ff2b2b;">Leaderboard</h1>

<br>

<table>

<tr>

<th>Name</th>

<th>Exercise</th>

<th>Record</th>

</tr>

<tr>

<td>Rahul</td>

<td>Bench Press</td>

<td>100kg</td>

</tr>

<tr>

<td>Aman</td>

<td>Deadlift</td>

<td>180kg</td>

</tr>

</table>

<br>

<button class="red">

Approve Record

</button>

<button class="red">

Reject

</button>

`;

}

function membership(){

document.getElementById("content").innerHTML=`

<h1 style="color:#ff2b2b;">Membership</h1>

<br>
<h1>Membership</h1>

<input id="searchMember" placeholder="Search Member">

<input id="memberName" placeholder="Member Name">

<input id="memberPhone" placeholder="Phone Number">

<input type="date" id="joinDate">

<select id="feeStatus">
    <option>Active</option>
    <option>Due</option>
</select>

<button onclick="addMember()">Add Member</button>

<br><br>

<table>

<tr>
    <th>Name</th>
    <th>Expiry</th>
    <th>Status</th>
    <th>Action</th>
</tr>

<tbody id="memberTable">

</tbody>
</table>

<br>

<button class="red">

Renew Membership

</button>

`;

}

function email(){

document.getElementById("content").innerHTML=`

<h1 style="color:#ff2b2b;">Email</h1>

<br>

<p>Email reminder system will be connected with Firebase.</p>

<input placeholder="Member Email">

<button class="red">

Send Reminder

</button>

`;

}

function settings(){

document.getElementById("content").innerHTML=`

<h1 style="color:#ff2b2b;">Settings</h1>

<br>

<p>Admin settings will appear here.</p>

<button class="red">

Change Password

</button>

<button class="red">

Backup Data

</button>

`;

}

dashboard();
let memberList = [
"Rahul",
"Aman",
"Riya"
];

function loadMembers(){

let table=document.getElementById("memberTable");

if(!table)return;

table.innerHTML="";

memberList.forEach((name,index)=>{

table.innerHTML+=`
<tr>
<td>${name}</td>
<td>
<button class="red" onclick="deleteMember(${index})">Delete</button>
</td>
</tr>
`;

});

}

let memberList = JSON.parse(localStorage.getItem("members")) || [];

function saveMembers(){
    localStorage.setItem("members", JSON.stringify(memberList));
}

function loadMembers(){

    let table = document.getElementById("memberTable");

    if(!table) return;

    let search = "";

    let searchBox = document.getElementById("searchMember");

    if(searchBox){
        search = searchBox.value.toLowerCase();
    }

    table.innerHTML = "";

    memberList.forEach((member,index)=>{

        if(
            member.name.toLowerCase().includes(search) ||
            member.phone.includes(search)
        ){

            table.innerHTML += `
            <tr>
                <td>${member.name}</td>
                <td>${member.join}</td>
                <td>${member.fee}</td>
                <td>
                    <button class="red" onclick="deleteMember(${index})">
                        Delete
                    </button>
                </td>
            </tr>
            `;
        }

    });

}

function addMember(){

    let name=document.getElementById("memberName").value.trim();
    let phone=document.getElementById("memberPhone").value.trim();
    let join=document.getElementById("joinDate").value;
    let fee=document.getElementById("feeStatus").value;

    if(name==""){
        alert("Enter Member Name");
        return;
    }

    memberList.push({
        name:name,
        phone:phone,
        join:join,
        fee:fee
    });

    saveMembers();

    document.getElementById("memberName").value="";
    document.getElementById("memberPhone").value="";
    document.getElementById("joinDate").value="";
    document.getElementById("feeStatus").value="Active";

    loadMembers();

}

function deleteMember(index){

    if(confirm("Delete this member?")){

        memberList.splice(index,1);

        saveMembers();

        loadMembers();

    }

}

window.onload=function(){

    loadMembers();

}
</script>

</body>

</html>
