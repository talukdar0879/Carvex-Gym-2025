<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CARVEX Admin</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0d0d0d;
color:#fff;
display:flex;
min-height:100vh;
}

.sidebar{
width:280px;
background:#111;
border-right:2px solid #ff2b2b;
padding:25px;
}

.logo{
font-size:30px;
font-weight:bold;
text-align:center;
margin-bottom:40px;
}

.logo span{
color:#ff2b2b;
}

.menu button{

width:100%;
background:#181818;
border:2px solid #333;
color:#fff;
padding:15px;
margin-bottom:15px;
border-radius:10px;
cursor:pointer;
font-size:16px;
transition:.3s;

}

.menu button:hover{

background:#ff2b2b;

}

.main{

flex:1;
padding:30px;

}

.top{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(220px,1fr));

gap:20px;

margin-bottom:30px;

}

.stat{

background:#181818;

border:2px solid #ff2b2b;

padding:25px;

border-radius:15px;

text-align:center;

}

.stat h2{

font-size:38px;

color:#ff2b2b;

margin-bottom:10px;

}

.stat p{

color:#aaa;

}

#content{

background:#181818;

border-radius:15px;

padding:30px;

min-height:500px;

border:2px solid #333;

}

table{

width:100%;

border-collapse:collapse;

margin-top:20px;

}

table th{

background:#ff2b2b;

padding:12px;

}

table td{

padding:12px;

border-bottom:1px solid #333;

}

input{

width:100%;

padding:12px;

margin:10px 0;

background:#111;

border:1px solid #444;

color:white;

border-radius:8px;

}

button.red{

background:#ff2b2b;

border:none;

padding:12px 20px;

color:white;

border-radius:8px;

cursor:pointer;

margin-top:10px;

}

button.red:hover{

background:#ff5555;

}

@media(max-width:900px){

body{

flex-direction:column;

}

.sidebar{

width:100%;

}

}

</style>

</head>

<body>

<div class="sidebar">

<div class="logo">

CARVEX

<span>ADMIN</span>

</div>

<div class="menu">

<button onclick="dashboard()">🏠 Dashboard</button>

<button onclick="members()">👥 Members</button>

<button onclick="leaderboard()">🏆 Leaderboard</button>

<button onclick="membership()">💰 Membership</button>

<button onclick="email()">📧 Email</button>

<button onclick="settings()">⚙ Settings</button>

</div>

</div>

<div class="main">

<div class="top">

<div class="stat">

<h2 id="members">38</h2>

<p>Total Members</p>

</div>

<div class="stat">

<h2 id="income">₹18600</h2>

<p>Monthly Income</p>

</div>

<div class="stat">

<h2 id="due">6</h2>

<p>Fees Due</p>

</div>

<div class="stat">

<h2 id="records">3</h2>

<p>Pending Records</p>

</div>

</div>

<div id="content">

<h1 style="color:#ff2b2b;">Welcome Admin</h1>

<br>

<p>Select a menu from the left.</p>

</div>

</div>

<script>

function dashboard(){

document.getElementById("content").innerHTML=`

<h1 style="color:#ff2b2b;">Dashboard</h1>

<br>

<p>Welcome back, Admin.</p>

<table>

<tr>
<th>Today's Summary</th>
<th>Value</th>
</tr>

<tr>
<td>Total Members</td>
<td>38</td>
</tr>

<tr>
<td>Income</td>
<td>₹18,600</td>
</tr>

<tr>
<td>Pending Records</td>
<td>3</td>
</tr>

<tr>
<td>Fees Due</td>
<td>6</td>
</tr>

</table>

`;

}

function members(){

document.getElementById("content").innerHTML=`

<h1 style="color:#ff2b2b;">Members</h1>

<br>

<input placeholder="Search Member">

<table>

<tr>

<th>Name</th>

<th>Status</th>

<th>Expiry</th>

</tr>

<tr>

<td>Rahul</td>

<td>Active</td>

<td>25 Aug</td>

</tr>

<tr>

<td>Aman</td>

<td>Expired</td>

<td>30 Jul</td>

</tr>

<tr>

<td>Riya</td>

<td>Active</td>

<td>10 Aug</td>

</tr>

</table>

<button class="red">

Add Member

</button>

`;

}

function leaderboard(){

document.getElementById("content").innerHTML=`

<h1 style="color:#ff2b2b;">Leaderboard</h1>

<br>

<table>

<tr>

<th>Name</th>

<th>Exercise</th>

<th>Record</th>

</tr>

<tr>

<td>Rahul</td>

<td>Bench Press</td>

<td>100kg</td>

</tr>

<tr>

<td>Aman</td>

<td>Deadlift</td>

<td>180kg</td>

</tr>

</table>

<br>

<button class="red">

Approve Record

</button>

<button class="red">

Reject

</button>

`;

}

function membership(){

document.getElementById("content").innerHTML=`

<h1 style="color:#ff2b2b;">Membership</h1>

<br>

<table>

<tr>

<th>Name</th>

<th>Expiry</th>

<th>Status</th>

</tr>

<tr>

<td>Rahul</td>

<td>25 Aug</td>

<td>Active</td>

</tr>

<tr>

<td>Aman</td>

<td>30 Jul</td>

<td>Expired</td>

</tr>

</table>

<br>

<button class="red">

Renew Membership

</button>

`;

}

function email(){

document.getElementById("content").innerHTML=`

<h1 style="color:#ff2b2b;">Email</h1>

<br>

<p>Email reminder system will be connected with Firebase.</p>

<input placeholder="Member Email">

<button class="red">

Send Reminder

</button>

`;

}

function settings(){

document.getElementById("content").innerHTML=`

<h1 style="color:#ff2b2b;">Settings</h1>

<br>

<p>Admin settings will appear here.</p>

<button class="red">

Change Password

</button>

<button class="red">

Backup Data

</button>

`;

}

dashboard();

</script>

</body>

</html>
